<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <title>Marquee Moon</title>
  <defs>
    <!-- Crescent: full disc minus an offset disc -->
    <mask id="crescent">
      <circle cx="30" cy="36" r="17" fill="#fff"/>
      <circle cx="38" cy="30" r="14" fill="#000"/>
    </mask>
    <radialGradient id="glow" cx="30" cy="36" r="24" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f2b33d" stop-opacity=".22"/>
      <stop offset="1" stop-color="#f2b33d" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Projection-room tile -->
  <rect width="64" height="64" rx="14" fill="#0e0d0c"/>
  <circle cx="30" cy="36" r="24" fill="url(#glow)"/>

  <!-- Marquee bulbs -->
  <g fill="#f2b33d">
    <circle cx="14" cy="10" r="2.6"/>
    <circle cx="24.7" cy="10" r="2.6"/>
    <circle cx="35.3" cy="10" r="2.6"/>
    <circle cx="46" cy="10" r="2.6"/>
  </g>

  <!-- Moon -->
  <rect width="64" height="64" fill="#f2b33d" mask="url(#crescent)"/>

  <!-- Single lit bulb, echoing the navbar brand dot -->
  <circle cx="43" cy="27" r="3.4" fill="#ffc965"/>
</svg>
